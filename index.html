// o: { st, g:'m'|'f', hair, style, fit, top, bot, skirt, gl, bald, mood:'n'|'h'|'s'|'z', blink, fr:0|1|2, cane, beard, shades }
function person(o) {

    case 'life': case 'review': drawLife(); break;
    case 'end': drawEnd(); break;
    case 'inherit': drawEnd(); flush(); drawInherit(); break;
    case 'ach': drawAch(); break;
    case 'shop': drawShop(); drawParts(); break;
    case 'book': drawBook(); break;
  }
  flush();
  if (menuOpen) { drawMenu(); flush(); }
  if (statInfo) { drawStatInfo(); flush(); }
  if (TOASTS.length) { drawToast(); flush(); }
}

// ============================================================ boot
window.addEventListener('resize', fit); fit();
buildScenes();
const ALLTEXT = [...new Set((SCRIPT_TEXT.match(/[^\x00-\x7f]/g) || []))].join('') + '0123456789+-×/SABCD';
try { if (document.fonts && document.fonts.load) document.fonts.load('12px "ZCOOL QingKe HuangYou"', ALLTEXT).catch(() => {}); } catch (e) {}
let last = performance.now();
let frameErr = 0;
window.__rlBooted = true;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now; // a frame's timestamp can predate the boot time
  // one bad frame must not freeze the game on a blank screen: log it, and bail out to the title if it keeps happening
  try { update(dt); render(); musicUpdate(wantedTrack()); frameErr = 0; }
  catch (e) {
    console.error(e);
    if (frameErr === 0 && window.__rlErr) window.__rlErr(String(e && e.stack || e).slice(0, 600));
    if (++frameErr === 20 && state !== 'title') { menuOpen = false; go('title'); }
    if (frameErr === 60) { clearRun(); frameErr = 0; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
