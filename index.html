(() => {

}

const HAIRC = {

};

const FITS = {

  robe: { top: '#eaf4ff', bot: '#eaf4ff', dress: 1, band: '#4a90d9', wide: 1 },
  demon: { top: '#2e1e34', bot: '#2e1e34', dress: 1, band: '#d8283a', wide: 1 },
  yao: { top: '#e8dcc0', bot: '#e8dcc0', dress: 1, band: '#e8943a', wide: 1 },
  hanfu: { top: '#5a88c8', bot: '#5a88c8', dress: 1, band: '#e8c060', wide: 1 },
  guan: { top: '#c8283a', bot: '#c8283a', dress: 1, band: '#ffd23f', wide: 1, hat: 'guan' },
  huang: { top: '#ffc62a', bot: '#ffc62a', dress: 1, band: '#c8283a', wide: 1, hat: 'guan' },

  pirate: { top: '#d8403a', bot: '#3a3a4a', band: '#ffd23f', hat: 'pirate' },
  armor: { top: '#c8d0dc', bot: '#4a4a5c', cape: '#c8283a', band: '#8a5a34', metal: 1 },
  king: { top: '#c8d0dc', bot: '#4a4a5c', cape: '#8a2ad0', band: '#ffd23f', metal: 1, hat: 'crown' },
  space: { top: '#f0f0f4', bot: '#f0f0f4', band: '#f07830', visor: 1 },
  farmer: { top: '#4a7fc0', bot: '#6a5a3a', hat: 'straw', plaid: '#3a62a0' },
  rich: { top: '#7a2238', bot: '#3a1a28', shirt: '#f4f4f4', tie: '#ffd23f', btn: '#ffd23f' },
  teacher: { top: '#8a6a4a', bot: '#4a4a5c', shirt: '#f4f4f4', glasses: 1 },

const PERS = new Map();
// o: { st, g:'m'|'f', hair, style, fit, top, bot, skirt, gl, bald, mood:'n'|'h'|'s'|'z', blink, fr:0|1|2, cane, beard, shades }
function person(o) {
  const key = [o.st, o.g, o.hair, o.style, o.fit, o.top, o.bot, o.skirt, o.gl, o.bald, o.mood, o.blink, o.fr, o.cane, o.beard, o.shades, o.ears].join('|');

  };

    const bl = o.top || '#ffc8dc', bl2 = shade(bl, -.12);

    G.px([[4, oy + 16], [15, oy + 16]], SKIN);
    G.ell(cx, oy + 11.2, 5.3, 4.8, SKIN);
    G.px([[9, oy + 6], [10, oy + 6], [10, oy + 5], [11, oy + 7], [8, oy + 7], [9, oy + 7], [10, oy + 7]], hc[0]);
    face(oy + 10, [7, 12]);

  } else {
    const [n, m] = BODY[o.st], t0 = oy + 12, wide = o.st === 'mid' || fit.wide;
    const tx0 = wide ? 6 : 7, tx1 = wide ? 13 : 12, ax0 = tx0 - 1, ax1 = tx1 + 1;
    const legTop = t0 + n, shoeY = legTop + m, old = o.st === 'old';
    const style = o.style || (o.g === 'f' ? (o.st === 'tod' || o.st === 'kid' ? 'pony' : old ? 'bun' : 'long') : 'short');
    // behind the body: cape, veil, long hair
    if (o.ears) { G.ell(16.5, t0 + n - 1, 2.6, 4.2, '#e8943a'); G.ell(17.2, t0 + n - 4, 1.6, 1.6, '#fff4e8'); }
    if (fit.cape) { G.rect(tx0 - 2, t0, tx1 - tx0 + 5, n + m - 1, fit.cape); G.rect(tx0 - 3, t0 + 2, tx1 - tx0 + 7, n + m - 3, fit.cape); }

    if (fit.phones) G.px([[tx0, t0 + 1], [tx0 + 1, t0 + 2], [tx0 + 2, t0 + 3]], fit.band);

    if (fit.scarf) { G.rect(8, t0, 4, 1, '#e8453c'); G.px([[9, t0 + 1], [10, t0 + 1]], '#e8453c'); }
    if (fit.num) G.px([[10, t0 + 1], [9, t0 + 2], [10, t0 + 2], [10, t0 + 3]], fit.num);
    if (fit.sparkle) G.px([[8, t0 + 1], [11, t0 + 3], [9, t0 + 4]], '#fff2fa');
    if (fit.flower) G.set(8, t0 + 1, fit.flower);
    // legs, skirt/dress and shoes
    const shoe = '#4a3434', lift = o.fr === 1 ? 'l' : o.fr === 2 ? 'r' : '';
    const legs = (c, from) => {
      for (let y = from; y < shoeY; y++) {

    } else {
      if (o.skirt || fit.shorts) { G.rect(tx0 - 1, legTop, tx1 - tx0 + 3, 1, bot); if (m > 1) G.rect(tx0 - (o.skirt ? 1 : 0), legTop + 1, tx1 - tx0 + 1 + (o.skirt ? 2 : 0), 1, o.skirt ? bot : SKIN); legs(SKIN, legTop + 2); }

      G.rect(4, oy + 5, 12, 1, hc[0]);

      if (style === 'long') G.px([[4, oy + 8], [15, oy + 8]], hc[0]);

      if (style === 'bun') G.ell(cx, oy - .2, 2.6, 2.2, hc[0]);

    }
    if (!o.bald) G.px([[7, oy + 2], [8, oy + 2], [6, oy + 3]], hc[1]);
    if (o.ears) { const ec = '#e8943a'; G.px([[4, oy + 1], [5, oy + 1], [6, oy + 1], [4, oy], [5, oy], [4, oy - 1], [4, oy - 2], [13, oy + 1], [14, oy + 1], [15, oy + 1], [14, oy], [15, oy], [15, oy - 1], [15, oy - 2]], ec); G.px([[5, oy], [14, oy]], '#ffc0b0'); }

    if (o.shades || fit.shades) { G.rect(5, oy + 7, 4, 2, OUT); G.rect(11, oy + 7, 4, 2, OUT); G.rect(9, oy + 7, 2, 1, OUT); G.px([[6, oy + 7], [12, oy + 7]], '#6a6a9a'); }
    // hats

// Gains get harder the higher a stat already is (happiness saturates fastest), so lives don't all end maxed out.
function addFx(fx, raw) {
  for (const k in fx) {
    let v = fx[k];
    if (v > 0 && !raw) { let got = 0; for (let i = 0; i < v; i++) { const c = L.a[k] + got; if (Math.random() < clamp((k === 'SPR' ? 1.5 : 1.7) - c / (k === 'SPR' ? 11 : 13), .2, 1)) got++; } v = got; }
    if (!v) continue;
    L.a[k] += v; YR.d[k] = (YR.d[k] || 0) + v; if (L.a[k] > L.mx[k]) L.mx[k] = L.a[k];
  }
}
const canLove = () => !tal('danshen') && !L.love && !L.mar;
function newPartner(o) { return Object.assign({ g: L.g === 'm' ? 'f' : 'm', hair: pick(['black', 'black', 'brown']), top: pick(TOPS), bot: pick(BOTS), skirt: chance(.5) }, o || {}); }
function startLove(o) { L.love = 1; L.loveAge = L.age; L.f.loved = 1; L.pt = newPartner(o); }
function endLove() { L.love = 0; L.mar = 0; L.pt = null; }
function marry() { L.mar = 1; L.love = 1; L.marAge = L.age; L.f.mar1 = 1; }
function addKid() { const k = { g: chance(.5) ? 'm' : 'f', born: L.age, hair: L.pt && chance(.5) ? L.pt.hair : L.look.hair, top: pick(TOPS), bot: pick(BOTS) }; L.kids.push(k); return k; }
const CAT_N = [['小橘', '年糕', '大黄', '橘座'], ['煤球', '黑米', '芝麻', '警长']], DOG_N = [['旺财', '豆豆', '可乐', '来福'], ['小白', '雪球', '棉花', '汤圆']];
function getPet(k) { const alt = chance(.4) ? 1 : 0; L.pet = { k, alt, born: L.age, n: pick((k === 'cat' ? CAT_N : DOG_N)[alt]) }; L.lastPet = { k, alt, n: L.pet.n }; L.f['had' + k] = 1; }
function setJob(j) { L.job = j; L.jobAge = L.age; return JOBS[j].t || null; }
const homeSc = () => L.a.MNY >= 9 ? 'home2' : (L.a.MNY >= 4 || L.f.house) ? 'home1' : 'home0';
function fmt(s) {
  return s.replace(/\{(\w+)\}/g, (m, k) => {
    const pg = L.pt ? L.pt.g : (L.g === 'm' ? 'f' : 'm');
    switch (k) {
      case 'sex': return L.g === 'm' ? '男孩' : '女孩';
      case 'opp': return L.g === 'm' ? '女生' : '男生';
      case 'ta': return pg === 'm' ? '他' : '她';
      case 'spouse': return pg === 'm' ? '老公' : '老婆';
      case 'bf': return L.g === 'm' ? '女朋友' : '男朋友';
      case 'kid': { const k = L.kids[L.kids.length - 1]; return k ? (k.g === 'm' ? '儿子' : '女儿') : '孩子'; }
      case 'kid0': return L.kids[0] ? (L.kids[0].g === 'm' ? '儿子' : '女儿') : '孩子';
      case 'grand': return L.g === 'm' ? '孙子' : '孙女';
      case 'mama': return L.g === 'm' ? '爸爸' : '妈妈';
      case 'pet': return L.pet ? (L.pet.k === 'cat' ? '猫' : '狗') : '宠物';
      case 'pn': return L.pet ? L.pet.n : '';
      case 'job': return L.job ? JOBS[L.job].n : '打工人';
      case 'xiong': return L.g === 'm' ? '师妹' : '师兄';
      case 'qm': return L.qm ? L.qm.n : '';
      case 'qmsay': return L.qm && L.qm.g === 'f' ? '嫁给你' : '娶你';
      case 'bro': return L.bro ? L.bro.n : '';
      case 'bm': return L.g === 'm' ? '伴郎' : '伴娘';
      default: return m;
    }
  });
}

function gaokao(second) {
  const bonus = (tal('kaoshen') ? 60 : 0) + (L.f.keyh ? 20 : 0) + (tal('chongsheng') ? 40 : 0) + (second ? 25 : 0);
  const s = clamp(R(110 + L.a.INT * 42 + rand(-45, 45) + bonus), 120, 750), t = '高考放榜，你考了' + s + '分，';
  L.f.score = s;
  if (s >= 735) { L.f.zy = L.f.top = L.f.uni = 1; addFx({ INT: 1, SPR: 2 }); YR.big = '高考状元!'; return [t + '成为了全省高考状元！', '清北的招生老师为了抢你，差点在你家门口打起来。']; }
  if (s >= 680) { L.f.top = L.f.uni = 1; addFx({ INT: 1, SPR: 1 }); YR.big = '金榜题名!'; return t + '被清北录取了！'; }
  if (s >= 610) { L.f.t985 = L.f.uni = 1; addFx({ SPR: 1 }); return t + '考上了一所985名校。'; }
  if (s >= 480) { L.f.ben = L.f.uni = 1; return t + '考上了一所普通本科。'; }
  if (s >= 380) { L.f.zhuan = L.f.uni = 1; return t + '上了一所大专。'; }
  if (L.a.MNY >= 8) { L.f.abroad = L.f.uni = 1; return [t + '落榜了。', '家里托关系，把你送出国留学了。']; }
  if (!second) { YR.ch = 'gk'; return t + '落榜了。复读，还是去社会上闯一闯？'; }
  L.f.nouni = 1; return [t + '落榜了。', '你决定不再读书，直接去社会上闯荡。'];
}

function assignJob(tier) {
  const a = L.a, o = [], add = (j, w) => { if (w > 0) o.push([j, w]); };
  const hi = { phd: 3, master: 2.5, top: 2.5, t985: 2, abroad: 1.6, ben: 1.2, zhuan: .6, voc: .3 }[tier] || 0;
  add('scientist', (tier === 'phd' ? 4 : tier === 'master' || tier === 'top' ? 1 : 0) * (a.INT >= 9 ? 1.5 : .5));
  add('doctor', hi >= 2 ? 1.5 : hi >= 1.2 && a.INT >= 7 ? .6 : 0);
  add('coder', hi >= 1.2 ? 2.2 : hi > .5 ? .8 : 0);
  add('civil', hi >= 1 ? 1.5 : 0); add('teacher', hi >= 1 ? 1 : 0);
  add('office', hi >= .6 ? 2 : .3); add('boss', hi >= 1.2 ? .3 : .15);
  add('chef', hi <= .6 ? 1.2 : 0); add('rider', hi <= .6 ? 1.2 : .1); add('worker', hi <= .6 ? 1.5 : 0);
  add('farmer', hi <= .3 && a.MNY <= 3 ? 1 : 0); add('streamer', a.CHR >= 7 ? .8 : .25); add('writer', a.INT >= 7 ? .4 : 0);
  add('none', a.MNY >= 7 && a.SPR >= 6 ? .6 : a.MNY >= 5 ? .15 : 0);
  if (L.bp === 'county') { add('civil', 1); add('teacher', .6); }
  if (L.bp === 'village') add('farmer', .5);
  if (a.MNY >= 9) add('heir', 3);
  if (L.f.scout || a.CHR >= 10) add('star', L.f.scout ? 3 : 1.5);
  if (L.f.singoffer) add('singer', 4);
  if (L.f.espoffer) add('esports', 3);
  if (a.STR >= 9) add('athlete', a.STR >= 11 ? 3 : 1.5);
  return setJob(wpick(o, x => x[1])[0]);
}

    if (L.end) endT += dt;
  }
  if (state === 'end' && st > 1 && st - dt <= 1) { tone(180, .18, 'square', .08, 90); noise(.15, .12, 800); shake = 2; if (L.grade === 'SSS' || L.grade === 'SS') { confetti(50, 170); SFX.big(); } }
  for (const p of P) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  P = P.filter(p => p.t < p.life);
  for (const p of POPS) p.t += dt; POPS = POPS.filter(p => p.t < 1.3);
  if (TOASTS.length) { const t = TOASTS[0]; if (!t.t) SFX.ach(); t.t += dt; if (t.t > 2.6) TOASTS.shift(); }
  if (banner) { banner.t += dt; if (banner.t > 1.8) banner = null; }
  for (const k in hudFlash) { hudFlash[k].t += dt; if (hudFlash[k].t > 1) delete hudFlash[k]; }
}
function wantedTrack() {
  if (state === 'title' || state === 'ach' || state === 'shop' || state === 'book') return 'title';
  if (state === 'gacha' || state === 'fate' || state === 'talent' || state === 'alloc') return 'setup';
  if (state === 'life') { if (L.end) return 'end'; if (L.path === 'xian') return XSD().song; if (ROUTES[L.path]) return ROUTES[L.path].song; if (L.path === 'isekai') return 'isekai'; return L.age < 18 ? 'kid' : L.age < 60 ? 'adult' : 'old'; }
  return 'end';
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1;
  ctx.fillStyle = '#140c2a'; ctx.fillRect(0, 0, cv.width, cv.height);
  g.imageSmoothingEnabled = false; g.clearRect(0, 0, W, H); TQ.length = 0;
  switch (state) {
    case 'title': drawTitle(); break;
    case 'gacha': drawGacha(); break;
    case 'talent': drawTalentPick(); break;
    case 'fate': drawFateCard(); break;
    case 'alloc': drawAlloc(); break;
    case 'life': case 'review': drawLife(); break;
    case 'end': drawEnd(); break;
    case 'inherit': drawEnd(); flush(); drawInherit(); break;
    case 'ach': drawAch(); break;
    case 'shop': drawShop(); drawParts(); break;
    case 'book': drawBook(); break;
  }
  flush();
  if (menuOpen) { drawMenu(); flush(); }
  if (TOASTS.length) { drawToast(); flush(); }
}

// ============================================================ boot
window.addEventListener('resize', fit); fit();
buildScenes();
const ALLTEXT = [...new Set((SCRIPT_TEXT.match(/[^\x00-\x7f]/g) || []))].join('') + '0123456789+-×/SABCD';
try { if (document.fonts && document.fonts.load) document.fonts.load('12px "ZCOOL QingKe HuangYou"', ALLTEXT).catch(() => {}); } catch (e) {}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); musicUpdate(wantedTrack());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
